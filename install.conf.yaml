- defaults:
    link:
      relink: true
      create: true
      force: true

- clean: ['~']

- link:
    ~/.bash_profile: bash/bash_profile
    ~/.bashrc: bash/bashrc
    ~/.editorconfig: editorconfig
    ~/.gitconfig: git/gitconfig
    ~/.gitconfig-nine: git/gitconfig-nine
    # Only where the 1Password SSH agent holds the signing key, so commits never fail elsewhere
    ~/.gitconfig-signing:
      path: git/gitconfig-signing
      if: 'SSH_AUTH_SOCK="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" ssh-add -L 2>/dev/null | grep -qF "$(cut -d" " -f2 ssh/github-hisnamewasjaan.pub)"'
    # Only where the 1Password SSH agent holds the work signing key
    ~/.gitconfig-nine-signing:
      path: git/gitconfig-nine-signing
      if: 'SSH_AUTH_SOCK="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" ssh-add -L 2>/dev/null | grep -qF "$(cut -d" " -f2 ssh/gitlab-erst.pub)"'
    ~/.gitattributes: git/gitattributes
    ~/.gitignore: git/gitignore
    ~/.tmux.conf: tmux.conf
    ~/.vim/backups: vim/backups
    ~/.vim/swaps: vim/swaps
    ~/.vim/undo: vim/undo
    ~/.vim/vimrc: vim/vimrc
    ~/.zshenv: zsh/zshenv
    ~/.zprofile: zsh/zprofile
    ~/.zshrc: zsh/zshrc
    ~/.oh-my-zsh: zsh/ohmyzsh
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/glab-cli/config.yml: glab/config.yml
    ~/.config/glab-cli/aliases.yml: glab/aliases.yml
    ~/.config/ghostty/config.ghostty: ghostty/config.ghostty
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/skills/commit: claude/skills/commit
    ~/.claude/skills/adr: claude/skills/adr
    ~/.claude/skills/vue-component: claude/skills/vue-component
    ~/.claude/skills/spring-endpoint: claude/skills/spring-endpoint
    ~/.claude/skills/design-doc: claude/skills/design-doc
    ~/.claude/skills/review: claude/skills/review
    ~/.claude/skills/hetzner-cloud: claude/skills/hetzner-cloud
    ~/.ssh/github-hisnamewasjaan.pub: ssh/github-hisnamewasjaan.pub
    ~/.ssh/gitlab-erst.pub: ssh/gitlab-erst.pub
    ~/.ssh/allowed_signers: ssh/allowed_signers
    ~/.config/htop/htoprc: htop/htoprc
